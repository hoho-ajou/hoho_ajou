name: 하위 이슈 (Sub-issue) — PM/전체 (Epic 직속)
description: 특정 역할에 속하지 않는 총괄의 전체 조율 작업을 Epic(#1) 직속으로 쪼갠 것. 담당자가 직접 작성합니다.
title: "[PM] "
body:
  - type: input
    id: parent_epic
    attributes:
      label: 상위 이슈
      description: "Epic 번호를 그대로. 예: Relates to #1"
      placeholder: "Relates to #1"
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 무엇을 정리·결정·반영하는지 구체적으로. "이슈 정리"가 아니라 "docs/governance/OWNERSHIP.md에 R2~R4 실제 담당자 반영하고 .github/CODEOWNERS 갱신" 수준으로.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료조건 (Acceptance Criteria)
      description: 확인 가능한 조건.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고자료
      description: 관련 docs/design/00-overall.md 절 번호, docs/review/decisions/00-overall.md 등.
